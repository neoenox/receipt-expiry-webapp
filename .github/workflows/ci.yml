name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_VAPID: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: receipt-expiry-pwa/package-lock.json

      - name: Install dependencies
        working-directory: receipt-expiry-pwa
        run: npm ci

      - name: Install Playwright browser
        working-directory: receipt-expiry-pwa
        run: npx playwright install --with-deps chromium


      - name: Audit dependencies
        working-directory: receipt-expiry-pwa
        # 既知の脆弱性は Dependabot で追跡するため、ここでは警告に留める。
        run: npm audit --audit-level=high || true

      - name: Check JavaScript syntax
        working-directory: receipt-expiry-pwa
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON
        run: node -e 'for (const f of ["receipt-expiry-pwa/package.json", "receipt-expiry-pwa/public/manifest.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'

      - name: Check shell syntax
        run: bash -n receipt-expiry-pwa/deploy-cloudflare.sh

      - name: Build Pages Functions
        working-directory: receipt-expiry-pwa
        run: npx --yes wrangler@4 pages functions build functions --outdir .ci-functions-build --project-directory .

      - name: Build notification worker
        working-directory: receipt-expiry-pwa
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.notify.toml --outdir .ci-worker-build


      - name: Build rate limiter worker
        working-directory: receipt-expiry-pwa/ratelimit-worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir .ci-worker-build

      - name: Run tests
        working-directory: receipt-expiry-pwa
        run: npm test


      - name: Run E2E tests
        working-directory: receipt-expiry-pwa
        run: npm run test:e2e

      - name: Deploy rate limiter worker
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        working-directory: receipt-expiry-pwa/ratelimit-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy


      - name: Deploy to Cloudflare Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        working-directory: receipt-expiry-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name=receipt-expiry-pwa --branch=main
      - name: Sync VAPID private key
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.HAS_CF == 'true' && env.HAS_VAPID == 'true'
        working-directory: receipt-expiry-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: printf '%s' "$VAPID_PRIVATE_KEY" | npx --yes wrangler@4 secret put VAPID_PRIVATE_KEY --config wrangler.notify.toml

      - name: Sync VAPID public key
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.HAS_CF == 'true' && env.HAS_VAPID == 'true'
        working-directory: receipt-expiry-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: printf '%s' "$VAPID_PUBLIC_KEY" | npx --yes wrangler@4 secret put VAPID_PUBLIC_KEY --config wrangler.notify.toml

      - name: Deploy notification worker
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        working-directory: receipt-expiry-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.notify.toml



      - name: Sync shared Gemini key
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.HAS_CF == 'true' && env.HAS_GEMINI == 'true'
        working-directory: receipt-expiry-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 pages secret put GEMINI_API_KEY --project-name=receipt-expiry-pwa
